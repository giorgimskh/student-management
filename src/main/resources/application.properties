spring.application.name=student-management
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:secret}

# JPA / Hibernate Settings
# The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway. A database created earlier by ddl-auto has the tables but no Flyway history:
# it is marked as version 1 (V1__initial_schema) and only the later migrations run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Book loans
app.loans.period-days=14
# How often to look for loans that just became overdue (default: every hour, on the hour)
app.loans.overdue-check-cron=0 0 * * * *
